{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{{ action }} Issue</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group mb-3">
            {{ field.label_tag }}
            {{ field.errors }}
            {{ field|add_class:"form-control" }}
            {% if field.help_text %}
            <small class="form-text text-muted">{{ field.help_text }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'issue_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
